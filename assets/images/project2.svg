<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="p2bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="p2accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="320" rx="16" fill="url(#p2bg)"/>
  <rect x="2" y="2" width="596" height="316" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Browser Frame -->
  <rect x="50" y="40" width="500" height="240" rx="12" fill="#070b14" stroke="#475569" stroke-width="1.5"/>
  <rect x="50" y="40" width="500" height="32" rx="12" fill="#0f172a"/>
  <circle cx="70" cy="56" r="5" fill="#ef4444"/>
  <circle cx="86" cy="56" r="5" fill="#eab308"/>
  <circle cx="102" cy="56" r="5" fill="#22c55e"/>
  
  <rect x="130" y="48" width="220" height="16" rx="8" fill="#1e293b"/>
  <text x="140" y="60" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">https://likhitha-portfolio.dev</text>

  <!-- Hero simulation inside browser -->
  <rect x="80" y="95" width="100" height="14" rx="7" fill="rgba(56, 189, 248, 0.2)"/>
  <text x="90" y="106" font-family="sans-serif" font-size="9" font-weight="bold" fill="#38bdf8">👋 Portfolio</text>

  <text x="80" y="140" font-family="-apple-system, sans-serif" font-weight="800" font-size="22" fill="#ffffff">Meka Likhitha Sai</text>
  <text x="80" y="165" font-family="-apple-system, sans-serif" font-weight="600" font-size="14" fill="#a78bfa">Aspiring Software Developer_</text>

  <rect x="80" y="185" width="200" height="8" rx="4" fill="#475569" opacity="0.6"/>
  <rect x="80" y="200" width="160" height="8" rx="4" fill="#475569" opacity="0.4"/>

  <!-- Buttons in mini mockup -->
  <rect x="80" y="225" width="90" height="26" rx="6" fill="url(#p2accent)"/>
  <text x="125" y="242" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">View Projects</text>

  <rect x="180" y="225" width="80" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="#64748b" stroke-width="1"/>
  <text x="220" y="242" font-family="sans-serif" font-size="10" font-weight="bold" fill="#cbd5e1" text-anchor="middle">Contact</text>

  <!-- Mini Profile Card right side -->
  <rect x="340" y="95" width="170" height="155" rx="10" fill="#131d36" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="425" cy="140" r="28" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2"/>
  <text x="425" y="148" font-size="24" text-anchor="middle">👩‍💻</text>
  <rect x="365" y="185" width="120" height="10" rx="5" fill="#f8fafc" opacity="0.8"/>
  <rect x="380" y="202" width="90" height="8" rx="4" fill="#a78bfa" opacity="0.8"/>
  <rect x="365" y="222" width="120" height="16" rx="8" fill="rgba(16, 185, 129, 0.2)"/>
  <text x="425" y="233" font-family="sans-serif" font-size="9" font-weight="bold" fill="#34d399" text-anchor="middle">CGPA: 8.80 / 10</text>
