<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="320" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="596" height="316" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Glowing Aura -->
  <circle cx="300" cy="160" r="120" fill="url(#glow)" opacity="0.12" filter="blur(40px)"/>

  <!-- Browser / App Frame -->
  <rect x="50" y="40" width="500" height="240" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5"/>
  <rect x="50" y="40" width="500" height="32" rx="12" fill="#0b1120"/>
  <circle cx="70" cy="56" r="5" fill="#ef4444"/>
  <circle cx="86" cy="56" r="5" fill="#eab308"/>
  <circle cx="102" cy="56" r="5" fill="#22c55e"/>
  
  <rect x="130" y="48" width="220" height="16" rx="8" fill="#1e293b"/>
  <text x="140" y="60" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">https://food-delivery-app.local</text>

  <!-- Food Delivery UI Content -->
  <!-- Header inside App -->
  <rect x="75" y="90" width="160" height="18" rx="4" fill="#38bdf8" opacity="0.2"/>
  <text x="85" y="103" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#38bdf8">Delicious Food Delivery</text>

  <!-- Food cards inside app -->
  <!-- Card 1 -->
  <rect x="75" y="125" width="135" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="142" cy="160" r="22" fill="#f97316" opacity="0.2"/>
  <text x="142" y="166" font-size="20" text-anchor="middle">🍕</text>
  <rect x="90" y="195" width="80" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="90" y="210" width="50" height="6" rx="3" fill="#64748b"/>
  <rect x="90" y="225" width="105" height="18" rx="4" fill="#f97316"/>
  <text x="142" y="238" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">Add to Cart</text>

  <!-- Card 2 -->
  <rect x="232" y="125" width="135" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="299" cy="160" r="22" fill="#ec4899" opacity="0.2"/>
  <text x="299" y="166" font-size="20" text-anchor="middle">🍔</text>
  <rect x="247" y="195" width="80" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="247" y="210" width="50" height="6" rx="3" fill="#64748b"/>
  <rect x="247" y="225" width="105" height="18" rx="4" fill="#6366f1"/>
  <text x="299" y="238" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">Add to Cart</text>

  <!-- Card 3 -->
  <rect x="390" y="125" width="135" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="457" cy="160" r="22" fill="#22c55e" opacity="0.2"/>
  <text x="457" y="166" font-size="20" text-anchor="middle">🥗</text>
  <rect x="405" y="195" width="80" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="405" y="210" width="50" height="6" rx="3" fill="#64748b"/>
  <rect x="405" y="225" width="105" height="18" rx="4" fill="#10b981"/>
  <text x="457" y="238" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">Add to Cart</text>

  <!-- Tech Badges Overlay -->
  <rect x="420" y="86" width="105" height="22" rx="11" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="1"/>
  <text x="472" y="101" font-family="sans-serif" font-size="10" font-weight="bold" fill="#c084fc" text-anchor="middle">React • Node • SQLite</text>
</svg>
